# Publica el libro en GitHub Pages en cada push a main.
# El notebook se sube ya ejecutado, así que aquí no se vuelve a correr el análisis.
name: deploy-book
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  BASE_URL: /${{ github.event.repository.name }}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm install -g jupyter-book
      - run: jupyter-book build --html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html
      - id: deployment
        uses: actions/deploy-pages@v4
