# Jupyter Book 2 (MyST). Construir localmente: jupyter-book build --html  (requiere Node.js)
version: 1
project:
  title: Pronóstico de la velocidad del viento a 24 h en el Caribe colombiano
  authors:
    - name: Yuryen Rollo
    - name: Betzaida Ruiz
  license: CC-BY-SA-4.0
  bibliography:
    - references.bib
  toc:
    - file: index.md
    # numeración del profesor; los nombres de archivo se conservan para no romper los enlaces ya entregados
    - title: "Entregable 1: datos, EDA y modelo base"
      children:
        - file: entregable1.ipynb
    - title: "Entregable 1.5: dashboard"
      children:
        - file: dashboard.md
    - title: "Entregable 2: comparación de modelos"
      children:
        - file: entregable3.ipynb
    - title: "Entregable 3: modelo original"
      children:
        - file: correcciones.md
        - file: modelo_propuesto.ipynb
        - file: literatura.md
        - file: validacion.ipynb
        - file: conclusiones.md
        - file: reproducibilidad.ipynb
site:
  template: book-theme
